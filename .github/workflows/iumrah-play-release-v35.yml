name: iumrah Play Release AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Google Play versionCode (must be higher than every uploaded version)'
        required: true
        type: string
      version_name:
        description: 'Public versionName'
        required: true
        default: '2.0.3'
        type: string

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
      PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
      PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
      PLAY_UPLOAD_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
      IUMRAH_FIREBASE_API_KEY: ${{ secrets.IUMRAH_FIREBASE_API_KEY }}
      IUMRAH_FIREBASE_APP_ID: ${{ secrets.IUMRAH_FIREBASE_APP_ID }}
      IUMRAH_FIREBASE_PROJECT_ID: ${{ secrets.IUMRAH_FIREBASE_PROJECT_ID }}
      IUMRAH_FIREBASE_SENDER_ID: ${{ secrets.IUMRAH_FIREBASE_SENDER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore Play upload keystore
        shell: bash
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$PLAY_UPLOAD_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/iumrah-signing"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iumrah-signing/upload.jks"
          test -s "$RUNNER_TEMP/iumrah-signing/upload.jks"
          echo "PLAY_KEYSTORE_PATH=$RUNNER_TEMP/iumrah-signing/upload.jks" >> "$GITHUB_ENV"

      - name: Build and verify signed Play AAB
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-play-release.sh '${{ inputs.version_code }}' '${{ inputs.version_name }}'

      - name: Upload Play artifact
        uses: actions/upload-artifact@v4
        with:
          name: iumrah-play-${{ inputs.version_name }}-vc${{ inputs.version_code }}
          path: artifacts/play-release/*
          if-no-files-found: error
          retention-days: 14
